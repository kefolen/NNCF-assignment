[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-graph-viewer"
version = "0.1.0"
description = "Port-aware OpenVINO graph visualization with ordered graph-only transformations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openvino>=2024.0", "graphviz>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]
inspect = ["netron>=9"]
benchmark = ["psutil>=7", "scipy>=1.10"]

[project.scripts]
model-graph-viewer = "model_graph_viewer.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
